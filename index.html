<index.html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Painel TV - GPS Mobile</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { 
            font-family: 'Chakra Petch', sans-serif; 
            background-color: #000000; 
            color: #e2e8f0; 
            width: 100vw;
            overflow-x: hidden;
        }
        
        @media (min-width: 769px) {
            body { 
                height: 100vh; 
                overflow: hidden; 
            }
        }
        
        @media (max-width: 768px) {
            body { 
                min-height: 100vh; 
                height: auto;
                overflow-y: auto; 
            }
            .mobile-scroll { min-height: 100vh; }
        }

        .fade-enter-active { animation: fadeIn 0.6s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.98); } to { opacity: 1; transform: scale(1); } }
        #progress-bar { transition: width linear; }
        .neon-text-blue { text-shadow: 0 0 5px rgba(96, 165, 250, 0.5); }
        .neon-text-green { text-shadow: 0 0 5px rgba(74, 222, 128, 0.5); }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="flex flex-col p-2 md:p-3 pb-2 mobile-scroll">

    <header class="relative flex flex-col md:flex-row justify-between items-center mb-3 shrink-0 border-b border-gray-800 pb-2 gap-2 md:gap-0 transition-all duration-500">
        <div class="w-full md:w-1/3 flex flex-row md:flex-col justify-between md:justify-center items-center md:items-start order-2 md:order-1">
            <p id="clock" class="text-4xl md:text-6xl font-mono text-white font-bold tracking-tighter leading-none">00:00</p>
            <div class="flex items-center gap-3 mt-1 pl-1">
                <div class="flex items-center gap-1.5 bg-gray-900/80 px-2 py-0.5 rounded">
                    <span class="relative flex h-2 w-2 md:h-3 md:w-3"><span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75"></span><span class="relative inline-flex rounded-full h-2 w-2 md:h-3 md:w-3 bg-green-500"></span></span>
                    <p class="text-green-500 text-[10px] md:text-xs font-bold tracking-widest">AO VIVO</p>
                </div>
                <span id="header-date" class="text-sm md:text-lg text-gray-400 font-bold border-l-2 border-gray-700 pl-3">--/--</span>
            </div>
        </div>

        <div class="w-full md:w-1/3 flex flex-col justify-center items-center order-1 md:order-2 mb-1 md:mb-0">
            <div class="flex items-center gap-3">
                <div id="header-icon" class="p-1.5 md:p-2 rounded-xl bg-gray-900 shadow-lg transition-colors duration-500">
                    <i data-lucide="clock" class="w-5 h-5 md:w-7 md:h-7"></i>
                </div>
                <h1 id="page-title" class="text-xl md:text-3xl font-bold text-white tracking-wide leading-none drop-shadow-md transition-colors duration-500 text-center">CARREGANDO</h1>
            </div>
            <span id="page-count" class="text-[10px] md:text-xs text-gray-500 font-bold tracking-widest uppercase bg-gray-900 px-3 py-0.5 rounded mt-1">...</span>
        </div>

        <div class="w-full md:w-1/3 flex justify-end items-center order-3">
            <div id="weather-box-general" class="flex flex-col items-end hidden bg-black/60 px-3 py-1.5 rounded-xl border border-gray-700/50 shadow-lg backdrop-blur-sm">
                </div>
        </div>
    </header>

    <main class="flex-grow w-full relative min-h-0"> 
        <div id="content-grid" class="grid grid-cols-1 landscape:grid-cols-2 md:grid-cols-2 md:grid-rows-3 gap-3 md:gap-3 w-full h-auto md:h-full pb-16 md:pb-0"></div>
        
        <div id="loading" class="absolute inset-0 flex items-center justify-center bg-black/95 z-50">
            <div class="text-center">
                <div class="w-12 h-12 md:w-24 md:h-24 border-t-4 border-b-4 border-blue-500 rounded-full animate-spin mx-auto mb-4 md:mb-6"></div>
                <p class="text-lg md:text-3xl text-blue-400 animate-pulse font-bold tracking-widest">BUSCANDO DADOS</p>
                <p id="debug-status" class="text-gray-500 mt-2 text-xs md:text-sm font-mono">Iniciando...</p>
                <button onclick="loadMockData()" class="mt-6 px-4 py-2 bg-gray-800 text-[10px] md:text-xs text-gray-400 rounded hover:bg-gray-700 transition">Modo Demo</button>
            </div>
        </div>
    </main>

    <button onclick="manualPrev()" class="fixed top-1/2 left-0 -translate-y-1/2 z-50 p-2 md:p-3 rounded-r-xl transition-all duration-300 transform active:scale-95 text-white/70 bg-black/20 md:bg-transparent md:text-white/10 md:hover:text-white md:hover:bg-gray-800/90 backdrop-blur-sm md:backdrop-blur-none border border-white/10 md:border-transparent">
        <i data-lucide="chevron-left" class="w-8 h-8 md:w-10 md:h-10"></i>
    </button>

    <button onclick="manualNext()" class="fixed top-1/2 right-0 -translate-y-1/2 z-50 p-2 md:p-3 rounded-l-xl transition-all duration-300 transform active:scale-95 text-white/70 bg-black/20 md:bg-transparent md:text-white/10 md:hover:text-white md:hover:bg-gray-800/90 backdrop-blur-sm md:backdrop-blur-none border border-white/10 md:border-transparent">
        <i data-lucide="chevron-right" class="w-8 h-8 md:w-10 md:h-10"></i>
    </button>
    
    <div class="fixed bottom-0 left-0 h-1.5 md:h-1.5 bg-gray-900 w-full z-40"><div id="progress-bar" class="h-full w-0"></div></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
    <script>
        const SLIDE_DURATION = 15; 
        const MAX_ITEMS = 6;
        const BASE_LAT = "-23.565"; const BASE_LON = "-46.520"; 

        const cityCache = {}; 
        const weatherCache = {}; 

        function getWeatherText(code) {
            if (code === 0) return 'Céu limpo';
            if (code === 1) return 'Quase limpo';
            if (code === 2) return 'Parcialmente Nublado';
            if (code === 3) return 'Nublado';
            if (code >= 45 && code <= 48) return 'Nevoeiro';
            if (code >= 51 && code <= 55) return 'Garoa';
            if (code >= 56 && code <= 57) return 'Garoa gelada';
            if (code >= 61 && code <= 65) return 'Chuva';
            if (code >= 66 && code <= 67) return 'Chuva congelante';
            if (code >= 71 && code <= 77) return 'Neve';
            if (code >= 80 && code <= 82) return 'Pancadas de Chuva';
            if (code >= 95 && code <= 99) return 'Tempestades Esparsas';
            return 'Indefinido';
        }

        function getWeatherIconName(code) {
            if (code >= 0 && code <= 3) return 'cloud-sun';
            if (code >= 45 && code <= 48) return 'cloud-fog';
            if (code >= 51 && code <= 67) return 'cloud-rain';
            if (code >= 71 && code <= 77) return 'snowflake';
            if (code >= 80 && code <= 99) return 'cloud-lightning';
            return 'sun';
        }

        function updateBaseWeather() {
            fetchWeather(BASE_LAT, BASE_LON).then(data => {
                const box = document.getElementById('weather-box-general');
                box.classList.remove('hidden');
                
                if(!data) {
                    box.innerHTML = `
                        <div class="flex items-center gap-2 text-red-400 py-1 px-2">
                            <i data-lucide="satellite-dish" class="w-5 h-5 animate-pulse"></i>
                            <span class="text-xs font-bold uppercase tracking-widest">Satélite Offline</span>
                        </div>`;
                    lucide.createIcons();
                    return;
                }
                
                box.innerHTML = `
                    <span class="text-[9px] md:text-[10px] uppercase tracking-[0.2em] font-bold text-gray-400 mb-0.5">BASE ARICANDUVA</span>
                    <div class="flex items-center gap-3">
                        <i data-lucide="${getWeatherIconName(data.code)}" class="w-6 h-6 md:w-10 md:h-10 text-yellow-400"></i>
                        <span class="text-3xl md:text-5xl font-bold font-mono text-white leading-none">${data.temp}°</span>
                        <div class="h-8 w-px bg-gray-700 mx-1"></div>
                        <div class="flex flex-col leading-none">
                            <span class="text-[10px] md:text-sm text-gray-200 font-bold mb-1">${getWeatherText(data.code)}</span>
                            <div class="flex gap-2 text-[9px] md:text-xs text-gray-400 mt-0.5">
                                <span class="text-orange-400 font-bold">⬆${data.max}°</span>
                                <span class="text-blue-300 font-bold">⬇${data.min}°</span>
                                <span class="flex items-center gap-0.5 ml-1" title="Chuva"><i data-lucide="droplet" class="w-3 h-3 text-blue-400"></i> ${data.rain}%</span>
                                <span class="flex items-center gap-0.5" title="Vento"><i data-lucide="wind" class="w-3 h-3 text-gray-400"></i> ${data.wind} km/h</span>
                            </div>
                        </div>
                    </div>`;
                lucide.createIcons();
            });
        }

        async function fetchWeather(lat, lon) {
            const cacheKey = `${lat},${lon}`;
            const now = Date.now();
            
            // LÓGICA INTELIGENTE: Guarda sucesso por 1 hora. Guarda falha só por 10 min.
            if (weatherCache[cacheKey]) {
                const age = now - weatherCache[cacheKey].timestamp;
                if (weatherCache[cacheKey].data && age < 3600000) return weatherCache[cacheKey].data; // 1 hora
                if (!weatherCache[cacheKey].data && age < 600000) return null; // 10 min
            }
            
            try {
                const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,wind_speed_10m,weather_code&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=America%2FSao_Paulo&forecast_days=1`;
                const res = await fetch(url);
                if(!res.ok) throw new Error("Erro API Clima");
                const json = await res.json();
                const data = { 
                    temp: Math.round(json.current.temperature_2m), 
                    code: json.current.weather_code, 
                    humidity: Math.round(json.current.relative_humidity_2m),
                    wind: Math.round(json.current.wind_speed_10m),
                    rain: json.daily.precipitation_probability_max[0] || 0,
                    min: Math.round(json.daily.temperature_2m_min[0]),
                    max: Math.round(json.daily.temperature_2m_max[0])
                };
                weatherCache[cacheKey] = { timestamp: now, data: data };
                return data;
            } catch (e) { 
                console.error("Erro Clima", e); 
                weatherCache[cacheKey] = { timestamp: now, data: null }; 
                return null; 
            }
        }

        async function resolveCity(rawText) {
            if (!rawText || rawText.length < 3 || rawText.includes("---")) return null;
            let clean = rawText.replace(/[0-9]/g, '').trim().replace(/\s\s+/g, ' ');
            if(clean.length < 3) return null;
            
            const now = Date.now();
            if(cityCache[clean]) {
                const age = now - cityCache[clean].timestamp;
                if(cityCache[clean].data !== "NOT_FOUND" && age < 86400000) return cityCache[clean].data; // Guarda cidade por 24h
                if(cityCache[clean].data === "NOT_FOUND" && age < 600000) return null; // Se não achou, tenta de novo em 10 min
            }

            try {
                let q = encodeURIComponent
