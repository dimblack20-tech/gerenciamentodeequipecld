<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Painel TV - GPS Mobile</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { 
            font-family: 'Chakra Petch', sans-serif; 
            background-color: #000000; 
            color: #e2e8f0; 
            width: 100vw;
            overflow-x: hidden;
        }
        
        @media (min-width: 769px) {
            body { 
                height: 100vh; 
                overflow: hidden; 
            }
        }
        
        @media (max-width: 768px) {
            body { 
                min-height: 100vh; 
                height: auto;
                overflow-y: auto; 
            }
            .mobile-scroll { min-height: 100vh; }
        }

        .fade-enter-active { animation: fadeIn 0.6s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.98); } to { opacity: 1; transform: scale(1); } }
        #progress-bar { transition: width linear; }
        .neon-text-blue { text-shadow: 0 0 5px rgba(96, 165, 250, 0.5); }
        .neon-text-green { text-shadow: 0 0 5px rgba(74, 222, 128, 0.5); }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="flex flex-col p-2 md:p-3 pb-2 mobile-scroll">

    <header class="relative flex flex-col md:flex-row justify-between items-center mb-3 shrink-0 border-b border-gray-800 pb-2 gap-2 md:gap-0 transition-all duration-500">
        <div class="w-full md:w-1/3 flex flex-row md:flex-col justify-between md:justify-center items-center md:items-start order-2 md:order-1">
            <p id="clock" class="text-4xl md:text-6xl font-mono text-white font-bold tracking-tighter leading-none">00:00</p>
            <div class="flex items-center gap-3 mt-1 pl-1">
                <div class="flex items-center gap-1.5 bg-gray-900/80 px-2 py-0.5 rounded">
                    <span class="relative flex h-2 w-2 md:h-3 md:w-3"><span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75"></span><span class="relative inline-flex rounded-full h-2 w-2 md:h-3 md:w-3 bg-green-500"></span></span>
                    <p class="text-green-500 text-[10px] md:text-xs font-bold tracking-widest">AO VIVO</p>
                </div>
                <span id="header-date" class="text-sm md:text-lg text-gray-400 font-bold border-l-2 border-gray-700 pl-3">--/--</span>
            </div>
        </div>

        <div class="w-full md:w-1/3 flex flex-col justify-center items-center order-1 md:order-2 mb-1 md:mb-0">
            <div class="flex items-center gap-3">
                <div id="header-icon" class="p-1.5 md:p-2 rounded-xl bg-gray-900 shadow-lg transition-colors duration-500">
                    <i data-lucide="clock" class="w-5 h-5 md:w-7 md:h-7"></i>
                </div>
                <h1 id="page-title" class="text-xl md:text-3xl font-bold text-white tracking-wide leading-none drop-shadow-md transition-colors duration-500 text-center text-balance uppercase">CARREGANDO</h1>
            </div>
            <span id="page-count" class="text-[10px] md:text-xs text-gray-500 font-bold tracking-widest uppercase bg-gray-900 px-3 py-0.5 rounded mt-1">...</span>
        </div>

        <div class="w-full md:w-1/3 flex justify-end items-center order-3">
            <div id="weather-box-general" class="flex flex-col items-end hidden bg-black/60 px-3 py-1.5 rounded-xl border border-gray-700/50 shadow-lg backdrop-blur-sm"></div>
        </div>
    </header>

    <main class="flex-grow w-full relative min-h-0"> 
        <div id="content-grid" class="grid grid-cols-1 landscape:grid-cols-2 md:grid-cols-2 md:grid-rows-3 gap-3 md:gap-3 w-full h-auto md:h-full pb-16 md:pb-0"></div>
        
        <div id="loading" class="absolute inset-0 flex items-center justify-center bg-black/95 z-50">
            <div class="text-center">
                <div class="w-12 h-12 md:w-24 md:h-24 border-t-4 border-b-4 border-blue-500 rounded-full animate-spin mx-auto mb-4 md:mb-6"></div>
                <p class="text-lg md:text-3xl text-blue-400 animate-pulse font-bold tracking-widest">BUSCANDO DADOS</p>
                <p id="debug-status" class="text-gray-500 mt-2 text-xs md:text-sm font-mono">Iniciando...</p>
                <button onclick="loadMockData()" class="mt-6 px-4 py-2 bg-gray-800 text-[10px] md:text-xs text-gray-400 rounded hover:bg-gray-700 transition">Modo Demo</button>
            </div>
        </div>
    </main>

    <button onclick="manualPrev()" class="fixed top-1/2 left-0 -translate-y-1/2 z-50 p-2 md:p-3 rounded-r-xl transition-all duration-300 transform active:scale-95 text-white/70 bg-black/20 md:bg-transparent md:text-white/10 md:hover:text-white md:hover:bg-gray-800/90 backdrop-blur-sm md:backdrop-blur-none border border-white/10 md:border-transparent">
        <i data-lucide="chevron-left" class="w-8 h-8 md:w-10 md:h-10"></i>
    </button>

    <button onclick="manualNext()" class="fixed top-1/2 right-0 -translate-y-1/2 z-50 p-2 md:p-3 rounded-l-xl transition-all duration-300 transform active:scale-95 text-white/70 bg-black/20 md:bg-transparent md:text-white/10 md:hover:text-white md:hover:bg-gray-800/90 backdrop-blur-sm md:backdrop-blur-none border border-white/10 md:border-transparent">
        <i data-lucide="chevron-right" class="w-8 h-8 md:w-10 md:h-10"></i>
    </button>
    
    <div class="fixed bottom-0 left-0 h-1.5 md:h-1.5 bg-gray-900 w-full z-40"><div id="progress-bar" class="h-full w-0"></div></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
    <script>
        const SLIDE_DURATION = 15; 
        const MAX_ITEMS = 6;
        const BASE_LAT = "-23.565"; const BASE_LON = "-46.520"; 
        
        // CONFIGURAÇÃO DO APPSHEET
        const APP_ID = "GERENCIAMENTODEEQUIPES-V2-729853257-26-01-13-2";
        const APP_FORM_VIEW = "GERENCIAMENTO_Form"; 

        const cityCache = {}; 
        const weatherCache = {}; 

        function getWeatherText(code) {
            if (code === 0) return 'Céu limpo';
            if (code === 1) return 'Quase limpo';
            if (code === 2) return 'Parcialmente Nublado';
            if (code === 3) return 'Nublado';
            if (code >= 45 && code <= 48) return 'Nevoeiro';
            if (code >= 51 && code <= 55) return 'Garoa';
            if (code >= 56 && code <= 57) return 'Garoa gelada';
            if (code >= 61 && code <= 65) return 'Chuva';
            if (code >= 66 && code <= 67) return 'Chuva congelante';
            if (code >= 71 && code <= 77) return 'Neve';
            if (code >= 80 && code <= 82) return 'Pancadas de Chuva';
            if (code >= 95 && code <= 99) return 'Tempestades Esparsas';
            return 'Indefinido';
        }

        function getWeatherIconName(code) {
            if (code >= 0 && code <= 3) return 'cloud-sun';
            if (code >= 45 && code <= 48) return 'cloud-fog';
            if (code >= 51 && code <= 67) return 'cloud-rain';
            if (code >= 71 && code <= 77) return 'snowflake';
            if (code >= 80 && code <= 99) return 'cloud-lightning';
            return 'sun';
        }

        function updateBaseWeather() {
            fetchWeather(BASE_LAT, BASE_LON).then(data => {
                const box = document.getElementById('weather-box-general');
                box.classList.remove('hidden');
                if(!data) return;
                box.innerHTML = `
                    <span class="text-[9px] md:text-[10px] uppercase tracking-[0.2em] font-bold text-gray-400 mb-0.5">BASE ARICANDUVA</span>
                    <div class="flex items-center gap-3">
                        <i data-lucide="${getWeatherIconName(data.code)}" class="w-6 h-6 md:w-10 md:h-10 text-yellow-400"></i>
                        <span class="text-3xl md:text-5xl font-bold font-mono text-white leading-none">${data.temp}°</span>
                        <div class="h-8 w-px bg-gray-700 mx-1"></div>
                        <div class="flex flex-col leading-none">
                            <span class="text-[10px] md:text-sm text-gray-200 font-bold mb-1">${getWeatherText(data.code)}</span>
                            <div class="flex gap-2 text-[9px] md:text-xs text-gray-400 mt-0.5">
                                <span class="text-orange-400 font-bold">⬆${data.max}°</span>
                                <span class="text-blue-300 font-bold">⬇${data.min}°</span>
                                <span class="flex items-center gap-0.5 ml-1"><i data-lucide="droplet" class="w-3 h-3 text-blue-400"></i> ${data.rain}%</span>
                            </div>
                        </div>
                    </div>`;
                lucide.createIcons();
            });
        }

        async function fetchWeather(lat, lon) {
            const cacheKey = `${lat},${lon}`;
            const now = Date.now();
            if (weatherCache[cacheKey]) {
                const age = now - weatherCache[cacheKey].timestamp;
                if (weatherCache[cacheKey].data && age < 3600000) return weatherCache[cacheKey].data; 
                if (!weatherCache[cacheKey].data && age < 600000) return null; 
            }
            try {
                const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,wind_speed_10m,weather_code&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=America%2FSao_Paulo&forecast_days=1`;
                const res = await fetch(url);
                const json = await res.json();
                const data = { 
                    temp: Math.round(json.current.temperature_2m), 
                    code: json.current.weather_code, 
                    humidity: Math.round(json.current.relative_humidity_2m),
                    wind: Math.round(json.current.wind_speed_10m),
                    rain: json.daily.precipitation_probability_max[0] || 0,
                    min: Math.round(json.daily.temperature_2m_min[0]),
                    max: Math.round(json.daily.temperature_2m_max[0])
                };
                weatherCache[cacheKey] = { timestamp: now, data: data };
                return data;
            } catch (e) { 
                weatherCache[cacheKey] = { timestamp: now, data: null }; 
                return null; 
            }
        }

        async function resolveCity(rawText) {
            if (!rawText || rawText.length < 3 || rawText.includes("---")) return null;
            let clean = rawText.replace(/[0-9]/g, '').trim().replace(/\s\s+/g, ' ');
            const now = Date.now();
            if(cityCache[clean]) {
                const age = now - cityCache[clean].timestamp;
                if(cityCache[clean].data !== "NOT_FOUND" && age < 86400000) return cityCache[clean].data; 
            }
            try {
                let q = encodeURIComponent(clean + ", Brazil");
                let url = `https://geocoding-api.open-meteo.com/v1/search?name=${q}&count=1&language=pt&format=json`;
                let res = await fetch(url);
                let json = await res.json();
                if (json.results && json.results.length > 0) {
                    const result = { lat: json.results[0].latitude, lon: json.results[0].longitude };
                    cityCache[clean] = { timestamp: now, data: result };
                    return result;
                }
                cityCache[clean] = { timestamp: now, data: "NOT_FOUND" }; 
                return null;
            } catch (e) { return null; }
        }

        async function updateCardsWeather(items, isWeatherPage = false) {
            for (let item of items) {
                const prefix = isWeatherPage ? "weather-page-" : "weather-";
                const elId = `${prefix}${item.ID}`;
                let el = document.getElementById(elId);
                if(!el) continue;
                if (!item.REGIAO || item.REGIAO.trim() === "" || item.REGIAO === "---") { el.innerHTML = ""; continue; }
                
                const coords = await resolveCity(item.REGIAO);
                el = document.getElementById(elId);
                if (!el || !coords) continue;

                const w = await fetchWeather(coords.lat, coords.lon);
                el = document.getElementById(elId);
                if (!el || !w) continue;

                if (isWeatherPage) {
                    // LAYOUT DA PÁGINA FINAL (DISTRIBUÍDO)
                    el.innerHTML = `
                        <div class="flex flex-col justify-between items-center w-full h-full py-1">
                            <div class="flex justify-center items-center gap-4 w-full">
                                <i data-lucide="${getWeatherIconName(w.code)}" class="w-12 h-12 md:w-16 md:h-16 text-yellow-400 drop-shadow-[0_0_10px_rgba(250,204,21,0.3)]"></i>
                                <span class="text-4xl md:text-5xl font-bold text-white leading-none font-mono">${w.temp}°</span>
                                <div class="flex flex-col items-start leading-none border-l-2 border-gray-700 pl-3 ml-1">
                                    <span class="text-xs md:text-sm text-orange-400 font-mono font-bold mb-1">⬆ ${w.max}°</span>
                                    <span class="text-xs md:text-sm text-blue-300 font-mono font-bold">⬇ ${w.min}°</span>
                                </div>
                            </div>
                            <div class="text-sm md:text-lg text-blue-100 font-bold tracking-widest uppercase my-3 w-full text-center">${getWeatherText(w.code)}</div>
                            <div class="flex justify-between items-center w-full pt-3 border-t border-gray-700/60 text-[11px] md:text-sm text-gray-300 font-semibold px-2 md:px-6">
                                <span class="flex items-center gap-1"><i data-lucide="droplet" class="w-4 h-4 text-blue-400"></i>${w.rain}%</span>
                                <span class="flex items-center gap-1"><i data-lucide="droplets" class="w-4 h-4 text-teal-400"></i>${w.humidity}%</span>
                                <span class="flex items-center gap-1"><i data-lucide="wind" class="w-4 h-4 text-gray-400"></i>${w.wind}k</span>
                            </div>
                        </div>`;
                } else {
                    // LAYOUT ORIGINAL DOS CARDS DE EQUIPE
                    el.innerHTML = `
                        <div class="flex flex-col bg-black/80 px-3 py-2 rounded-xl border border-gray-700/50 shadow-lg min-w-[130px] md:min-w-[165px] shrink-0">
                            <div class="flex justify-between items-center gap-3">
                                <div class="flex items-center gap-2">
                                    <i data-lucide="${getWeatherIconName(w.code)}" class="w-6 h-6 md:w-8 md:h-8 text-yellow-400"></i>
                                    <span class="text-base md:text-2xl font-bold text-white leading-none">${w.temp}°</span>
                                </div>
                                <div class="flex flex-col items-end leading-none">
                                    <span class="text-[9px] md:text-[11px] text-orange-400 font-mono font-bold">⬆${w.max}°</span>
                                    <span class="text-[9px] md:text-[11px] text-blue-300 font-mono font-bold">⬇${w.min}°</span>
                                </div>
                            </div>
                            <div class="text-[11px] md:text-xs text-gray-300 font-semibold mt-2 mb-1.5 truncate">${getWeatherText(w.code)}</div>
                            <div class="flex justify-between items-center pt-1.5 border-t border-gray-700/80 text-[10px] md:text-[11px] text-gray-400 gap-2">
                                <span class="flex items-center gap-0.5"><i data-lucide="droplet" class="w-3 h-3 text-blue-400"></i>${w.rain}%</span>
                                <span class="flex items-center gap-0.5"><i data-lucide="droplets" class="w-3 h-3 text-teal-400"></i>${w.humidity}%</span>
                                <span class="flex items-center gap-0.5"><i data-lucide="wind" class="w-3 h-3 text-gray-400"></i>${w.wind}k</span>
                            </div>
                        </div>`;
                }
                lucide.createIcons();
            }
        }

        function createCardHTML(data, themeColor) {
            const borderClass = themeColor === 'DIURNO' ? 'border-yellow-500' : 'border-indigo-500';
            const badgeClass = themeColor === 'DIURNO' ? 'bg-yellow-500 text-black' : 'bg-indigo-600 text-white';
            const isViagem = data.VIAGEM && data.VIAGEM.toUpperCase().includes("X");
            const cardBackground = isViagem ? "bg-[#1f1717] border-r-4 border-r-rose-900/50" : "bg-gray-900";
            
            function getSignStyle(sin) {
                if (!sin) return { color: "bg-gray-800 text-gray-400", icon: "hash", label: "PADRÃO" };
                const text = sin.toUpperCase();
                if (text.includes("VERTICAL")) return { color: "bg-orange-600 text-white", icon: "signpost", label: "VERTICAL" };
                if (text.includes("HORIZONTAL")) return { color: "bg-cyan-600 text-white", icon: "minus", label: "HORIZ." };
                return { color: "bg-gray-700 text-gray-300", icon: "activity", label: text };
            }

            function isRodizio(dataStr, placa) {
                if (!placa || placa.length < 1) return false;
                const parts = dataStr.split('/');
                if (parts.length !== 3) return false;
                const d = new Date(parts[2], parts[1] - 1, parts[0]);
                const diaSemana = d.getDay(); 
                const finalPlaca = placa.trim().slice(-1);
                if (diaSemana === 1 && ["1", "2"].includes(finalPlaca)) return true;
                if (diaSemana === 2 && ["3", "4"].includes(finalPlaca)) return true;
                if (diaSemana === 3 && ["5", "6"].includes(finalPlaca)) return true;
                if (diaSemana === 4 && ["7", "8"].includes(finalPlaca)) return true;
                if (diaSemana === 5 && ["9", "0"].includes(finalPlaca)) return true;
                return false;
            }

            const sinStyle = getSignStyle(data.SINALIZACAO);
            const textoRodizio = themeColor === 'DIURNO' ? '⚠️ RODÍZIO das 07h as 10h' : '⚠️ RODÍZIO das 17h as 20h';
            const camRodizio = isRodizio(data.DATA, data.PLACA_CAM) ? `<span class="bg-red-600 text-white text-[7px] md:text-[9px] font-bold px-1.5 py-0.5 rounded ml-1 animate-pulse">${textoRodizio}</span>` : '';
            const apoioRodizio = isRodizio(data.DATA, data.PLACA_APOIO) ? `<span class="bg-red-600 text-white text-[7px] md:text-[9px] font-bold px-1.5 py-0.5 rounded ml-1 animate-pulse">${textoRodizio}</span>` : '';

            // BOTÃO DE EDITAR: REMOVIDO O target="_blank" PARA FACILITAR A ABERTURA DO APP NATIVO
            const appSheetLink = `https://www.appsheet.com/start/${APP_ID}#control=${APP_FORM_VIEW}&row=${encodeURIComponent(data.ID_KEY)}`;
            const btnEdit = data.ID_KEY ? `<a href="${appSheetLink}" class="md:hidden flex items-center justify-center bg-gray-800 p-2 rounded-lg border border-gray-700 ml-2 shadow-lg hover:bg-gray-700 transition active:scale-95"><i data-lucide="pencil" class="w-4 h-4 text-yellow-400"></i></a>` : '';

            return `
            <div class="${cardBackground} border-l-[4px] md:border-l-[8px] ${borderClass} rounded-r-xl px-2 py-3 md:px-3 md:py-2 shadow-2xl flex flex-col justify-between min-h-[170px] h-auto md:h-full fade-enter-active relative overflow-hidden mb-0">
                <i data-lucide="hard-hat" class="absolute right-[-10px] top-[-10px] w-12 h-12 md:w-24 md:h-24 text-white opacity-[0.04]"></i>
                <div class="flex justify-between items-start z-10 shrink-0 gap-2">
                    <div class="flex-1">
                        <div class="flex justify-between items-start w-full">
                            <div class="flex flex-wrap gap-1 items-center">
                                <span class="${badgeClass} text-sm md:text-xl font-bold px-2 py-0.5 rounded shadow inline-block truncate max-w-[150px] md:max-w-none">${data.OBRA}</span>
                                ${isViagem ? `<span class="bg-rose-700 text-white text-[9px] md:text-xs font-bold px-1.5 py-0.5 rounded shadow animate-pulse">VIAGEM</span>` : ''}
                            </div>
                        </div>
                        <div class="mt-1.5 flex justify-between items-center">
                             <div class="flex items-center">
                                <span class="text-xl md:text-3xl font-bold text-white tracking-wide block truncate">${data.EQUIPE || 'EQUIPE'}</span>
                                ${btnEdit}
                             </div>
                        </div>
                        <span class="${sinStyle.color} mt-1 text-[9px] md:text-xs font-bold px-1.5 py-0.5 rounded inline-flex items-center gap-1 uppercase tracking-widest"><i data-lucide="${sinStyle.icon}" class="w-3 h-3"></i> ${sinStyle.label}</span>
                    </div>
                    <div id="weather-${data.ID}" class="transition-opacity duration-500 shrink-0"></div>
                </div>
                <div class="grid grid-cols-2 gap-2 mt-2 z-10 flex-grow content-center">
                    <div class="bg-slate-800/50 p-2 rounded-lg border border-blue-900/50">
                        <div class="flex items-center gap-1.5 mb-1 text-blue-400 font-bold uppercase text-[9px] md:text-xs neon-text-blue"><i data-lucide="truck" class="w-3 h-3 md:w-4 md:h-4"></i> Caminhão ${camRodizio}</div>
                        <div class="text-lg md:text-2xl text-white font-mono font-bold leading-none truncate">${data.PLACA_CAM}</div>
                        <div class="text-blue-300 text-[10px] md:text-xs mt-0.5 font-semibold truncate">${data.CAMINHAO}</div>
                    </div>
                    <div class="bg-slate-800/50 p-2 rounded-lg border border-green-900/50">
                        <div class="flex items-center gap-1.5 mb-1 text-green-400 font-bold uppercase text-[9px] md:text-xs neon-text-green"><i data-lucide="car" class="w-3 h-3 md:w-4 md:h-4"></i> Apoio ${apoioRodizio}</div>
                        <div class="text-lg md:text-2xl text-white font-mono font-bold leading-none truncate">${data.PLACA_APOIO}</div>
                        <div class="text-green-300 text-[10px] md:text-xs mt-0.5 font-semibold truncate">${data.APOIO}</div>
                    </div>
                </div>
                <div class="mt-2 pt-1 border-t border-gray-800 z-10 shrink-0">
                    <p class="text-gray-400 text-xs md:text-sm leading-snug line-clamp-2 md:line-clamp-1 font-medium">${data.EQUIP}</p>
                </div>
            </div>`;
        }

        function createWeatherPageCardHTML(data) {
            return `
            <div class="bg-gray-900 border-l-[4px] md:border-l-[8px] border-blue-500 rounded-r-xl px-4 py-4 shadow-2xl flex flex-col justify-between min-h-[170px] h-auto md:h-full fade-enter-active relative overflow-hidden mb-0">
                <i data-lucide="cloud-sun" class="absolute right-[-10px] top-[-10px] w-20 h-20 md:w-32 md:h-32 text-blue-500 opacity-[0.05]"></i>
                <div class="z-10 flex justify-between items-center mb-3 shrink-0 border-b border-gray-800 pb-2">
                    <span class="text-blue-400 text-lg md:text-2xl font-bold tracking-widest uppercase">${data.REGIAO}</span>
                    <span class="text-gray-500 text-[9px] md:text-[10px] uppercase tracking-widest bg-gray-800 px-2 py-0.5 rounded">Previsão Estimada</span>
                </div>
                <div id="weather-page-${data.ID}" class="flex-grow flex flex-col justify-center items-center z-10 w-full h-full"></div>
            </div>`;
        }

        let currentSlideIndex = 0;
        let slides = [];

        function renderSlide() {
            if (slides.length === 0) return;
            document.getElementById('loading').style.display = 'none';
            const slide = slides[currentSlideIndex];
            const container = document.getElementById('content-grid');
            const title = document.getElementById('page-title');
            const dateDisplay = document.getElementById('header-date');
            const pageCount = document.getElementById('page-count');
            
            const firstTeamSlide = slides.find(s => s.type !== 'CLIMA');
            dateDisplay.innerText = firstTeamSlide ? firstTeamSlide.items[0].DATA : "--/--";
            pageCount.innerText = `PÁGINA ${currentSlideIndex + 1} / ${slides.length}`;

            if (slide.type === 'CLIMA') {
                title.innerText = "PREVISÃO ESTIMADA";
                title.className = "text-xl md:text-3xl font-bold text-blue-400 tracking-wide drop-shadow-md leading-none text-center uppercase";
                document.getElementById('header-icon').innerHTML = '<i data-lucide="cloud-sun" class="w-5 h-5 md:w-7 md:h-7 text-blue-400"></i>';
                container.innerHTML = slide.items.map(item => createWeatherPageCardHTML(item)).join('');
                updateCardsWeather(slide.items, true);
            } else {
                title.innerText = slide.type === 'DIURNO' ? "ESCALA DIURNA" : "ESCALA NOTURNA";
                title.className = slide.type === 'DIURNO' ? "text-xl md:text-3xl font-bold text-yellow-500 uppercase" : "text-xl md:text-3xl font-bold text-indigo-400 uppercase";
                document.getElementById('header-icon').innerHTML = `<i data-lucide="${slide.type === 'DIURNO' ? 'sun' : 'moon'}" class="w-5 h-5 md:w-7 md:h-7"></i>`;
                container.innerHTML = slide.items.map(item => createCardHTML(item, slide.type)).join('');
                updateCardsWeather(slide.items, false);
            }

            lucide.createIcons();
            const bar = document.getElementById('progress-bar');
            bar.style.transition = 'none'; bar.style.width = '0%';
            setTimeout(() => { bar.style.transition = `width ${SLIDE_DURATION}s linear`; bar.style.width = '100%'; }, 50);
        }

        function processData(rows) {
            let dayItems = []; let nightItems = [];
            let uniqueCities = new Set();
            let weatherItems = [];

            rows.forEach((row, index) => {
                if (index === 0 && row[0].includes("ID_UNICO")) return; // Pula cabeçalho
                let d = { 
                    ID_KEY: row[16] || "", // COLUNA Q (Índice 16) - USADA PELO APPSHEET
                    DATA: row[0],       // A
                    TURNO_RAW: row[1],  // B
                    EQUIPE: row[2],     // C 
                    VIAGEM: row[3],     // D
                    OBRA: row[4],       // E
                    REGIAO: row[5],     // F
                    SIN: row[6],        // G
                    P_CAM: row[7],      // H
                    CAM: row[8],        // I
                    EQUIP: row[9],      // J
                    P_APOIO: row[10],   // K 
                    APOIO: row[11],     // L
                    LINK_CAM: row[14] || "",   // O 
                    LINK_APOIO: row[15] || "", // P
                    ID: index
                };
                if (!d.EQUIPE || d.EQUIPE === "") return;
                let currentSection = d.TURNO_RAW.toUpperCase().includes("NOTURNO") ? 'NOTURNO' : 'DIURNO';
                if (currentSection === 'DIURNO') dayItems.push(d); else nightItems.push(d);

                if (d.REGIAO && d.REGIAO !== "---") {
                    const clean = d.REGIAO.trim().toUpperCase();
                    if (!uniqueCities.has(clean)) {
                        uniqueCities.add(clean);
                        weatherItems.push({ ID: index, REGIAO: d.REGIAO });
                    }
                }
            });

            slides = [];
            for (let i = 0; i < dayItems.length; i += MAX_ITEMS) slides.push({ type: 'DIURNO', items: dayItems.slice(i, i + MAX_ITEMS) });
            for (let i = 0; i < nightItems.length; i += MAX_ITEMS) slides.push({ type: 'NOTURNO', items: nightItems.slice(i, i + MAX_ITEMS) });
            for (let i = 0; i < weatherItems.length; i += MAX_ITEMS) slides.push({ type: 'CLIMA', items: weatherItems.slice(i, i + MAX_ITEMS) });

            currentSlideIndex = 0;
            renderSlide();
            if(window.slideInterval) clearInterval(window.slideInterval);
            window.slideInterval = setInterval(() => {
                if (currentSlideIndex >= slides.length - 1) atualizarDados();
                currentSlideIndex = (currentSlideIndex + 1) % slides.length;
                renderSlide();
            }, SLIDE_DURATION * 1000);
        }

        function atualizarDados() {
            const url = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRSrIAzEFpEZV1t2A5FDqY5OuJSc1LX7-4I0hFMUoL3iPoRTSr-JKeyIIhvCH5ZYzYWSLR9g35OUnnC/pub?gid=104037742&single=true&output=csv&t=' + new Date().getTime();
            fetch(url).then(res => res.text()).then(csv => {
                Papa.parse(csv, { header: false, skipEmptyLines: true, complete: (results) => processData(results.data) });
            });
        }

        function manualPrev() { currentSlideIndex = (currentSlideIndex - 1 + slides.length) % slides.length; renderSlide(); }
        function manualNext() { currentSlideIndex = (currentSlideIndex + 1) % slides.length; renderSlide(); }
        setInterval(() => { const now = new Date(); document.getElementById('clock').innerText = now.toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'}); }, 1000);

        document.addEventListener("DOMContentLoaded", () => { atualizarDados(); updateBaseWeather(); });
    </script>
</body>
</html>
